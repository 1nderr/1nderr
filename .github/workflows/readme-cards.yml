name: Update README cards

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Two runs pushing card commits at once leaves the loser with a stale checkout.
concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The stats card reads account-level contribution data, which GITHUB_TOKEN
      # cannot access ("Resource not accessible by integration"). Set the
      # STATS_TOKEN secret to a classic PAT with the read:user scope.
      - name: Generate stats card
        # stats-organization/github-readme-stats-action v1, pinned to a commit
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be
        with:
          card: stats
          options: show_icons=true&hide_rank=true&hide_border=true&bg_color=00000000&text_color=ffffff&title_color=4493f8&icon_color=4493f8
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Same card in GitHub's light-theme colors; the README picks between them.
      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be
        with:
          card: stats
          options: show_icons=true&hide_rank=true&hide_border=true&bg_color=00000000&text_color=1f2328&title_color=0969da&icon_color=0969da
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # The card takes only one icon_color and its own body type, so per-icon
      # colors and the languages card's font are applied afterwards.
      - name: Style stats card
        run: |
          python3 .github/scripts/style_stats_card.py profile/stats.svg dark
          python3 .github/scripts/style_stats_card.py profile/stats-light.svg light

      # The languages card is built here rather than by the action above: the
      # GitHub API only reports bytes per language, and the action's repo-count
      # mode is order-dependent rather than a real count. Counting lines needs
      # the source, so the repos get cloned and measured with scc.
      - name: Install scc
        run: |
          curl -sSL -o /tmp/scc.tar.gz \
            https://github.com/boyter/scc/releases/download/v4.0.0/scc_Linux_x86_64.tar.gz
          echo "b8535fb0714dd33c5434c24de181e4d1a632e6a1f869e1985bbd10ad8b838545  /tmp/scc.tar.gz" \
            | sha256sum -c -
          tar xzf /tmp/scc.tar.gz -C /tmp scc

      - name: Build top languages card
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          # STATS_TOKEN has repo scope, so private repos are listed and cloned.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.STATS_TOKEN && '1' || '0' }}
          SCC_BIN: /tmp/scc
          OUT: profile/top-langs.svg
        run: python3 .github/scripts/build_lang_card.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && exit 0
          git commit -m "Update README cards"
          # If the branch moved while the cards were being generated, replay this
          # commit on top of it; -X theirs keeps the freshly generated cards.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || exit 1
            sleep 5
          done
          exit 1
