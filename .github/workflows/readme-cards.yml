name: Update README cards

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Two runs pushing card commits at once leaves the loser with a stale checkout.
concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The stats card reads account-level contribution data, which GITHUB_TOKEN
      # cannot access ("Resource not accessible by integration"). Set the
      # STATS_TOKEN secret to a classic PAT with the read:user scope.
      - name: Generate stats card
        # stats-organization/github-readme-stats-action v1, pinned to a commit
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be
        with:
          card: stats
          options: show_icons=true&hide_rank=true&hide_border=true&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be
        with:
          card: top-langs
          # Rank purely by how many repos use each language, not by byte count.
          options: layout=compact&hide_border=true&langs_count=8&size_weight=0&count_weight=1&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && exit 0
          git commit -m "Update README cards"
          # If the branch moved while the cards were being generated, replay this
          # commit on top of it; -X theirs keeps the freshly generated cards.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || exit 1
            sleep 5
          done
          exit 1
